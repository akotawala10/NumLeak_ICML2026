[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numleak"
version = "0.1.0"
description = "NumLeak: audit memorization of public numeric benchmarks in foundation models."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Anonymous"}]
keywords = [
  "memorization",
  "llm",
  "audit",
  "fama-french",
  "macroeconomic-data",
  "benchmark-leakage",
]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "scipy>=1.11",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
openai = ["openai>=1.40"]
all = ["anthropic>=0.30", "openai>=1.40"]

[project.scripts]
factor-leak = "factor_leak.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["factor_leak*"]
exclude = ["tests*", "experiments*", "paper*", "figures*", "data*"]
